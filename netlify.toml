# Déploiement Netlify.
# Les redirections (_redirects, 301 + page 404) et les en-têtes (_headers) sont générés dans dist/
# par le build ; ce fichier ne fait que décrire le build.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 exige Node 20.19+ ou 22.12+.
  NODE_VERSION = "22"
  # Domaine de production : sert aux canonicals, au sitemap et à robots.txt.
  VITE_SITE_URL = "https://rassmatours.com"
  # VITE_GA4_ID et VITE_INQUIRY_ENDPOINT : à définir dans Site configuration > Environment variables.

# Aperçus de déploiement et branches : jamais indexés par Google.
[context.deploy-preview.environment]
  VITE_NOINDEX = "true"

[context.branch-deploy.environment]
  VITE_NOINDEX = "true"

# Développement local avec les Netlify Functions et Blobs : `npx netlify dev` (http://localhost:8888).
[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  framework = "#custom"
